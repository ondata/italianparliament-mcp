name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: NODE_OPTIONS="--max-old-space-size=4096" npx tsc --noEmit

      # Suite completa, test dei tool compresi, sulle risposte SPARQL registrate
      # in test/fixtures/sparql (#117): nessuna richiesta a dati.camera.it /
      # dati.senato.it, che rifiutano i runner GitHub Actions. Fallisce anche se
      # una fixture manca (query cambiata: va registrata) o non viene più letta.
      # I test che chiedono altro (AKN su GitHub, HTML Camera) qui si saltano.
      # Le fixture si rifanno dal vivo alla release (RELEASING.md, test:record).
      - name: Tests (SPARQL replay from fixtures)
        run: npm run test:replay
